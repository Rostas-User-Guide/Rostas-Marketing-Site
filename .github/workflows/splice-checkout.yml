name: Splice checkout script into fresh export

# Whenever a new Claude Design export is committed as raw-export.html,
# automatically re-embed the Stripe checkout script and commit the result
# as index.html -- the file Cloudflare Pages actually deploys.
#
# This exists because a raw Claude Design export always drops the
# hand-written checkout script (see README.md), and forgetting to run
# scripts/splice-checkout.py by hand before deploying has broken the
# pricing page's buttons twice already (9 Aug, 26 Aug 2026). This job
# does that step for you, every time, and fails loudly (never deploying
# a broken export) if anything looks wrong.

on:
  push:
    branches: [main]
    paths:
      - 'raw-export.html'

permissions:
  contents: write

concurrency:
  group: splice-checkout
  cancel-in-progress: false

jobs:
  splice:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Splice checkout script into the fresh export
        run: python3 scripts/splice-checkout.py raw-export.html index.html

      - name: Commit spliced index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged -- nothing to commit."
            exit 0
          fi
          git commit -m "Auto-splice checkout script into fresh export

          Source: raw-export.html @ ${{ github.sha }}
          Generated by .github/workflows/splice-checkout.yml -- see README.md"
          git push
