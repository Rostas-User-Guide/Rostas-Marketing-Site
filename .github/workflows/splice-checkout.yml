name: Splice checkout script into fresh export

# Whenever a new Claude Design export is committed as raw-export.html,
# automatically re-embed the Stripe checkout script and commit the result
# as index.html -- the file Cloudflare Pages actually deploys.
#
# This exists because a raw Claude Design export always drops the
# hand-written checkout script (see README.md), and forgetting to run
# scripts/splice-checkout.py by hand before deploying has broken the
# pricing page's buttons twice already (9 Aug, 26 Aug 2026). This job
# does that step for you, every time, and fails loudly (never deploying
# a broken export) if anything looks wrong.

# It also runs when anything in scripts/ changes (added 12 Oct 2026), so a
# change to the beta popup wording or to the splice itself rebuilds
# index.html from the export already in the repository. Before this, such a
# change sat unused until the next Claude Design export was uploaded.

# Since 22 Oct 2026 a second step, scripts/prerender.py, turns the spliced
# 5.7 MB bundle into plain HTML plus content-named files in assets/ (see
# README.md "Plain HTML"). It runs on every branch, so a branch push gets a
# Cloudflare preview of the finished page before it reaches main.

on:
  push:
    branches: ['**']
    paths:
      - 'raw-export.html'
      - 'scripts/**'
      - '.github/workflows/splice-checkout.yml'

permissions:
  contents: write

concurrency:
  group: splice-checkout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  splice:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless Chromium (Playwright)
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Splice checkout script into the fresh export
        run: python3 scripts/splice-checkout.py raw-export.html "$RUNNER_TEMP/spliced.html"

      - name: Turn the bundle into plain HTML
        run: python3 scripts/prerender.py "$RUNNER_TEMP/spliced.html" .

      - name: Check the finished page
        run: python3 scripts/test_seo.py

      - name: Commit index.html and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A assets
          if git diff --cached --quiet; then
            echo "index.html and assets unchanged -- nothing to commit."
            exit 0
          fi
          git commit -m "Auto-build index.html (plain HTML) from raw-export.html

          Source: raw-export.html @ ${{ github.sha }}
          Generated by .github/workflows/splice-checkout.yml -- see README.md"
          git push origin "HEAD:${{ github.ref_name }}"
